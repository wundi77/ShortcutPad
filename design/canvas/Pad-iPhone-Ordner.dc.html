<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>iPhone Ordnerseite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #5B9BFF;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.tile{position:relative;aspect-ratio:1/1;border:0;border-radius:16px;padding:6px 5px 12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.35)}
.tl{font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tk{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:.02em}
.tab{position:absolute;top:0;left:14%;width:34%;height:8px;border-radius:0 0 6px 6px}
.tb{position:absolute;left:20%;right:20%;bottom:7px;height:3px;border-radius:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;padding-top:56px;overflow:hidden;background:radial-gradient(120% 40% at 50% 0%,rgba(11,99,240,.18),rgba(11,99,240,0) 70%),#0E0F12">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px">
    <span style="display:inline-flex;align-items:center;min-height:44px;color:#A3A6AF;font-size:15px;font-weight:600">Photoshop ›</span>
    <button aria-label="Set fixieren" style="flex:none;width:44px;height:44px;border:0;border-radius:50%;background:#1C1D21;color:#B9BCC5;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 13v8"/></svg>
    </button>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:0 16px;margin-top:2px">
    <span style="width:11px;height:11px;border-radius:50%;background:#CC420C"></span>
    <span style="font-size:28px;font-weight:800;letter-spacing:-.01em">Ebenen</span>
  </div>

  <div style="flex:1;min-height:0;margin-top:16px;padding:0 14px;overflow:hidden">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
        <button class="tile" style="{{t.style}}">
          <span class="tab" style="{{t.tab}}"></span>
          <span class="tl" style="font-size:{{t.size}}px">{{t.label}}</span>
          <span class="tk" style="{{t.kf}}">{{t.keys}}</span>
          <span class="tb" style="{{t.bar}}"></span>
        </button>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const COLORS={rot:'#E11D48',orange:'#CC420C',pink:'#DB2777',blau:'#0B63F0',indigo:'#6D4DE6',gruen:'#15803D',tuerkis:'#0E7490',grau:'#64748B'};
const GROUPS={Datei:'blau',Bearbeiten:'indigo',Ebenen:'orange',Auswahl:'rot',Werkzeug:'gruen',Ansicht:'tuerkis'};
const BTN=[['orange','Duplikat','⌘J',0],['orange','Gruppe','⌘G',0],['orange','Maske','⌥⌘G',0],['orange','Reduzieren','⇧⌘E',0]];
const VARIANT='bar';
const KEYS_PX=9.5;
class Component extends DCLogic{
  renderVals(){
    const tiles=BTN.map(b=>{
      const key=b[0];
      const c=COLORS[key];
      const filled=VARIANT==='fill'||(VARIANT==='mix'&&(b[3]||b.length>4));
      return {
        label:b[1],
        size:12.5,
        keys:b.length>4?b[4]+' Buttons':b[2],
        style:filled?'background:'+c+';color:#fff':'background:#25262B;color:#F2F3F5',
        kf:(filled?'color:rgba(255,255,255,.88)':'color:#A3A6AF')+';font-size:'+KEYS_PX+'px',
        bar:filled?'display:none':'background:'+c,
        tab:b.length>4?'background:'+(filled?'rgba(255,255,255,.4)':c):'display:none'
      };
    });
    tiles.unshift({size:44,label:'<',keys:'',style:'background:#D0D3DA;color:#1E1F23',kf:'display:none',bar:'display:none',tab:'display:none'});
    return {tiles:tiles};
  }
}
</script>
</body>
</html>
