<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Menüleiste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #5B9BFF;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.fl{display:block;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9A9DA7}
.row{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:8px 12px;border:0;border-radius:8px;background:transparent;color:inherit;font-size:14px;text-align:left;cursor:pointer;text-decoration:none}
.row:hover{background:#34363D}
.sw{position:relative;flex:none;width:42px;height:25px;border:0;border-radius:13px;cursor:pointer}
.sw i{position:absolute;top:2px;width:21px;height:21px;border-radius:50%;background:#fff}
</style>
</helmet>
<div style="width:360px;height:540px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:10px;background:#2A2B30;border-radius:14px;box-shadow:0 0 0 1px #40434B,0 24px 60px rgba(0,0,0,.55)">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 12px 2px">
    <div style="font-size:15px;font-weight:800">ShortcutPad</div>
    <div class="mono" style="font-size:11px;color:#9A9DA7">bereit</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:7px;padding:8px 12px 10px">
    <div style="display:flex;align-items:center;gap:9px;font-size:13px;color:#D5D7DD"><span style="width:8px;height:8px;border-radius:50%;background:#4ADE80"></span>Webseite aktiv · 1 Gerät gekoppelt</div>
    <div style="display:flex;align-items:center;gap:9px;font-size:13px;color:#D5D7DD"><span style="width:8px;height:8px;border-radius:50%;background:#4ADE80"></span>iPad Air verbunden</div>
    <div style="display:flex;align-items:center;gap:9px;font-size:13px;color:#D5D7DD"><span style="width:8px;height:8px;border-radius:50%;background:#4ADE80"></span>Bedienungshilfen freigegeben</div>
  </div>

  <div style="height:1px;background:#3A3C44;margin:0 4px"></div>

  <div style="padding:10px 12px 8px">
    <span class="fl">Vorne am Mac</span>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:600">Adobe Photoshop 2026</div>
        <div style="margin-top:2px;font-size:12.5px;color:#A3A6AF">Set Photoshop, automatisch gewählt</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <button class="sw" role="switch" aria-checked="false" aria-label="Set fixieren" style="background:#4A4D57"><i style="left:2px"></i></button>
        <span style="font-size:11px;color:#A3A6AF">Fixieren</span>
      </div>
    </div>
  </div>

  <div style="height:1px;background:#3A3C44;margin:0 4px"></div>

  <div style="padding:8px 2px 2px">
    <span class="fl" style="padding:0 10px 6px">Sets</span>
    <sc-for list="{{sets}}" as="s" hint-placeholder-count="5">
      <button class="row">
        <span style="{{s.dot}}"></span>
        <span style="flex:1">{{s.name}}</span>
        <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5B9BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="aktuell"><path d="M2.5 7.5 5.5 10.5 11.5 3.5"/></svg>
        </sc-if>
      </button>
    </sc-for>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:6px;border-top:1px solid #3A3C44">
    <a href="Main.dc.html" class="row"><span style="flex:1">Editor öffnen</span><span class="mono" style="font-size:12px;color:#9A9DA7">⌘E</span></a>
    <a href="Mac-Verbindung.dc.html" class="row"><span style="flex:1">Verbindung und Kopplung</span></a>
    <button class="row"><span style="flex:1">ShortcutPad beenden</span><span class="mono" style="font-size:12px;color:#9A9DA7">⌘Q</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":540}}'>
const COLORS={orange:'#CC420C',pink:'#DB2777',blau:'#0B63F0',tuerkis:'#0E7490',grau:'#64748B'};
class Component extends DCLogic{
  renderVals(){
    const dot=(k)=>'width:10px;height:10px;border-radius:50%;background:'+COLORS[k];
    return {
      sets:[
        {name:'Photoshop',dot:dot('blau'),on:true},
        {name:'Illustrator',dot:dot('orange'),on:false},
        {name:'InDesign',dot:dot('pink'),on:false},
        {name:'Lightroom',dot:dot('tuerkis'),on:false},
        {name:'Allgemein',dot:dot('grau'),on:false}
      ]
    };
  }
}
</script>
</body>
</html>
