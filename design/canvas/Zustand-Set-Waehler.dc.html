<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Set wählen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #5B9BFF;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.tile{position:relative;aspect-ratio:1/1;border:0;border-radius:16px;padding:6px 5px 12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.35)}
.tl{font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tk{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:.02em}
.tab{position:absolute;top:0;left:14%;width:34%;height:8px;border-radius:0 0 6px 6px}
.tb{position:absolute;left:20%;right:20%;bottom:7px;height:3px;border-radius:2px}
.row{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;min-height:56px;padding:8px 14px;border:0;border-radius:12px;background:transparent;color:inherit;text-align:left;cursor:pointer}
.sw{position:relative;flex:none;width:51px;height:31px;border:0;border-radius:16px;cursor:pointer}
.sw i{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;padding-top:56px;overflow:hidden;background:radial-gradient(120% 40% at 50% 0%,rgba(11,99,240,.18),rgba(11,99,240,0) 70%),#0E0F12">

  <div style="display:flex;align-items:center;gap:10px;padding:0 16px" aria-hidden="true">
    <div style="display:inline-flex;align-items:center;gap:9px;min-height:44px">
      <span style="width:11px;height:11px;border-radius:50%;background:#0B63F0"></span>
      <span style="font-size:24px;font-weight:800;letter-spacing:-.01em">Photoshop</span>
    </div>
  </div>
  <div style="flex:1;min-height:0;margin-top:30px;padding:0 14px;overflow:hidden" aria-hidden="true">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
        <div class="tile" style="{{t.style}}">
          <span class="tab" style="{{t.tab}}"></span>
          <span class="tl" style="font-size:12.5px">{{t.label}}</span>
          <span class="tk" style="{{t.kf}}">{{t.keys}}</span>
          <span class="tb" style="{{t.bar}}"></span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;inset:0;background:rgba(0,0,0,.58)"></div>

  <div role="dialog" aria-label="Set wählen" style="position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:14px;padding:10px 16px 38px;box-sizing:border-box;border-radius:26px 26px 0 0;background:#1C1D21;box-shadow:0 -1px 0 #34363D">
    <div style="align-self:center;width:38px;height:5px;border-radius:3px;background:#4A4D57" aria-hidden="true"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px">
      <div style="font-size:21px;font-weight:800">Set wählen</div>
      <a href="Pad-iPhone-hoch.dc.html" style="display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:16px;font-weight:600;color:#6FA8FF;text-decoration:none">Fertig</a>
    </div>

    <div style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:#25262B">
      <div style="flex:1;min-width:0">
        <div style="font-size:15.5px;font-weight:600">Automatisch wechseln</div>
        <div style="margin-top:3px;font-size:12.5px;line-height:1.4;color:#A3A6AF">Das Set folgt dem vordersten Programm am Mac.</div>
      </div>
      <button class="sw" role="switch" aria-checked="true" aria-label="Automatisch wechseln" style="background:#30D158"><i style="right:2px"></i></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{sets}}" as="s" hint-placeholder-count="5">
        <button class="row" style="{{s.style}}">
          <span style="{{s.dot}}"></span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:17px;font-weight:600">{{s.name}}</span>
            <span class="mono" style="display:block;margin-top:2px;font-size:11.5px;color:#A3A6AF">{{s.app}}</span>
          </span>
          <sc-if value="{{s.on}}" hint-placeholder-val="{{false}}">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#6FA8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="aktuell"><path d="M4 10.5 8 14.5 16 5.5"/></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>

    <div style="padding:0 2px;font-size:12.5px;line-height:1.45;color:#A3A6AF">Sets und Buttons legst du am Mac an. Hier wählst du nur aus.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const COLORS={rot:'#E11D48',orange:'#CC420C',pink:'#DB2777',blau:'#0B63F0',indigo:'#6D4DE6',gruen:'#15803D',tuerkis:'#0E7490',grau:'#64748B'};
const GROUPS={Datei:'blau',Bearbeiten:'indigo',Ebenen:'orange',Auswahl:'rot',Werkzeug:'gruen',Ansicht:'tuerkis'};
const BTN=[['blau','Speichern','⌘S',1],['indigo','Zurück','⌘Z',1],['orange','Neue Ebene','⇧⌘N',1],['gruen','Pinsel','B',1],['blau','Datei','',0,4],['indigo','Bearbeiten','',0,3],['orange','Ebenen','',0,4],['rot','Auswahl','',0,5],['gruen','Werkzeug','',0,2],['tuerkis','Ansicht','',0,3],['indigo','Vor','⇧⌘Z',0],['gruen','Radierer','E',0],['gruen','Bewegen','V',0],['tuerkis','Einpassen','⌘0',1]];
const VARIANT='bar';
const KEYS_PX=9.5;
class Component extends DCLogic{
  renderVals(){
    const tiles=BTN.map(b=>{
      const key=b[0];
      const c=COLORS[key];
      const filled=VARIANT==='fill'||(VARIANT==='mix'&&(b[3]||b.length>4));
      return {
        label:b[1],
        keys:b.length>4?b[4]+' Buttons':b[2],
        style:filled?'background:'+c+';color:#fff':'background:#25262B;color:#F2F3F5',
        kf:(filled?'color:rgba(255,255,255,.88)':'color:#A3A6AF')+';font-size:'+KEYS_PX+'px',
        bar:filled?'display:none':'background:'+c,
        tab:b.length>4?'background:'+(filled?'rgba(255,255,255,.4)':c):'display:none'
      };
    });
    const dot=(k)=>'width:12px;height:12px;border-radius:50%;background:'+COLORS[k];
    return {
      tiles:tiles,
      sets:[
        {name:'Photoshop',app:'Adobe Photoshop',dot:dot('blau'),on:true,style:'background:#25262B'},
        {name:'Illustrator',app:'Adobe Illustrator',dot:dot('orange'),on:false,style:'background:transparent'},
        {name:'InDesign',app:'Adobe InDesign',dot:dot('pink'),on:false,style:'background:transparent'},
        {name:'Lightroom',app:'Lightroom Classic',dot:dot('tuerkis'),on:false,style:'background:transparent'},
        {name:'Allgemein',app:'Alle anderen Programme',dot:dot('grau'),on:false,style:'background:transparent'}
      ]
    };
  }
}
</script>
</body>
</html>
