<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Button-Stile und Farben</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.fl{display:block;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#A3A6AF}
.tile{position:relative;aspect-ratio:1/1;border-radius:13px;padding:5px 4px 10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 5px 12px rgba(0,0,0,.35)}
.tl{font-weight:700;font-size:11.5px;line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tk{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:8.5px;letter-spacing:.02em}
.tb{position:absolute;left:20%;right:20%;bottom:6px;height:3px;border-radius:2px}
</style>
</helmet>
<div style="width:1120px;height:560px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px;padding:30px 32px;background:#0E0F12;border-radius:16px">

  <div style="display:flex;align-items:baseline;justify-content:space-between">
    <span class="fl">Button-Stile pro Set</span>
    <span style="font-size:13px;color:#A3A6AF">Nur Text auf dem Button, Farbe kommt von der Gruppe oder vom Button selbst.</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px">
    <sc-for list="{{styles}}" as="st" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="padding:16px;border-radius:20px;background:#14151A;box-shadow:inset 0 0 0 1px #24262C">
          <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
            <sc-for list="{{st.tiles}}" as="t" hint-placeholder-count="12">
              <div class="tile" style="{{t.style}}">
                <span class="tl">{{t.label}}</span>
                <span class="tk" style="{{t.kf}}">{{t.keys}}</span>
                <span class="tb" style="{{t.bar}}"></span>
              </div>
            </sc-for>
          </div>
        </div>
        <div>
          <div style="font-size:17px;font-weight:800">{{st.name}}</div>
          <div style="margin-top:3px;font-size:13px;line-height:1.4;color:#A3A6AF">{{st.desc}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top:auto">
    <span class="fl">Farbpalette</span>
    <div style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-top:12px">
      <sc-for list="{{palette}}" as="p" hint-placeholder-count="8">
        <div style="display:flex;flex-direction:column;gap:7px">
          <div style="{{p.style}}">{{p.sample}}</div>
          <div style="font-size:13px;font-weight:600">{{p.name}}</div>
          <div class="mono" style="font-size:10.5px;color:#A3A6AF">{{p.hex}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":560}}'>
const COLORS={rot:'#E11D48',orange:'#CC420C',pink:'#DB2777',blau:'#0B63F0',indigo:'#6D4DE6',gruen:'#15803D',tuerkis:'#0E7490',grau:'#64748B'};
const NAMES={rot:'Rot',orange:'Orange',pink:'Pink',blau:'Blau',indigo:'Indigo',gruen:'Grün',tuerkis:'Türkis',grau:'Grau'};
const GROUPS={Datei:'blau',Bearbeiten:'indigo',Ebenen:'orange',Auswahl:'rot',Werkzeug:'gruen',Ansicht:'tuerkis'};
const BTN=[['Datei','Neu','⌘N'],['Datei','Speichern','⌘S',1],['Datei','Speichern als','⇧⌘S'],['Datei','Für Web','⌥⇧⌘S'],['Bearbeiten','Zurück','⌘Z',1],['Bearbeiten','Vor','⇧⌘Z'],['Bearbeiten','Verlauf','⌥⌘Z'],['Bearbeiten','Kopieren','⌘C'],['Bearbeiten','Einfügen','⌘V'],['Ebenen','Neue Ebene','⇧⌘N',1],['Ebenen','Duplikat','⌘J'],['Ebenen','Gruppe','⌘G']];
class Component extends DCLogic{
  renderVals(){
    const mk=(variant)=>BTN.map(b=>{
      const c=COLORS[GROUPS[b[0]]];
      const filled=variant==='fill'||(variant==='mix'&&b[3]);
      return {
        label:b[1],
        keys:b[2],
        style:filled?'background:'+c+';color:#fff':'background:#25262B;color:#F2F3F5',
        kf:filled?'color:rgba(255,255,255,.88)':'color:#A3A6AF',
        bar:filled?'display:none':'background:'+c
      };
    });
    return {
      styles:[
        {name:'Balken',desc:'Dunkler Button, kurzer Farbbalken unten. Ruhig, gut bei vielen Buttons.',tiles:mk('bar')},
        {name:'Voll',desc:'Ganzer Button in der Farbe. Gruppen sind auf einen Blick erkennbar.',tiles:mk('fill')},
        {name:'Betont',desc:'Wichtige Buttons voll, der Rest als Balken. Wichtig stellst du am Mac pro Button ein.',tiles:mk('mix')}
      ],
      palette:Object.keys(COLORS).map(k=>({
        name:NAMES[k],
        hex:COLORS[k],
        sample:'Aa',
        style:'height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;background:'+COLORS[k]+';color:'+'#fff'
      }))
    };
  }
}
</script>
</body>
</html>
