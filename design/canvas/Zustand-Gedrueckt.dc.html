<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Button gedrückt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #5B9BFF;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.tile{position:relative;aspect-ratio:1/1;border:0;border-radius:16px;padding:6px 5px 12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.35)}
.tl{font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tk{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:.02em}
.tb{position:absolute;left:20%;right:20%;bottom:7px;height:3px;border-radius:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;padding-top:56px;overflow:hidden;background:radial-gradient(120% 40% at 50% 0%,rgba(11,99,240,.18),rgba(11,99,240,0) 70%),#0E0F12">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px">
    <div style="display:inline-flex;align-items:center;gap:9px;min-height:44px">
      <span style="width:11px;height:11px;border-radius:50%;background:#0B63F0"></span>
      <span style="font-size:24px;font-weight:800;letter-spacing:-.01em">Photoshop</span>
      <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#9A9DA7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      <span class="mono" style="padding:2px 6px;border:1px solid #3B3E47;border-radius:6px;font-size:10px;letter-spacing:.08em;color:#A3A6AF">AUTO</span>
    </div>
    <div style="flex:none;width:44px;height:44px;border-radius:50%;background:#1C1D21;color:#B9BCC5;display:inline-flex;align-items:center;justify-content:center" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 13v8"/></svg>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:0 16px;margin-top:-2px;font-size:12.5px;color:#A3A6AF">
    <span style="width:7px;height:7px;border-radius:50%;background:#4ADE80"></span>Mac Studio · USB · Photoshop vorne
  </div>

  <div style="flex:1;min-height:0;margin-top:16px;padding:0 14px;overflow:hidden">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
        <button class="tile" style="{{t.style}}">
          <span class="tl" style="font-size:12.5px">{{t.label}}</span>
          <span class="tk" style="{{t.kf}}">{{t.keys}}</span>
          <span class="tb" style="{{t.bar}}"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div role="status" style="position:absolute;left:16px;right:16px;bottom:34px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:#16281D;box-shadow:0 0 0 1px #24452F,0 14px 30px rgba(0,0,0,.5)">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#4ADE80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 8 14.5 16 5.5"/></svg>
    <div style="flex:1;min-width:0">
      <div style="font-size:14.5px;font-weight:700;color:#DDF8E6">Neue Ebene gesendet</div>
      <div class="mono" style="margin-top:2px;font-size:11.5px;color:#9FD9B4">⇧⌘N an Adobe Photoshop</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const COLORS={rot:'#E11D48',orange:'#CC420C',hellorange:'#E8884A',pink:'#DB2777',blau:'#0B63F0',indigo:'#6D4DE6',gruen:'#15803D',tuerkis:'#0E7490',grau:'#64748B'};
const GROUPS={Datei:'blau',Bearbeiten:'indigo',Ebenen:'orange',Auswahl:'rot',Werkzeug:'gruen',Ansicht:'tuerkis'};
const BTN=[['Datei','Neu','⌘N'],['Datei','Speichern','⌘S',1],['Datei','Speichern als','⇧⌘S'],['Datei','Für Web','⌥⇧⌘S'],['Bearbeiten','Zurück','⌘Z',1],['Bearbeiten','Vor','⇧⌘Z'],['Bearbeiten','Verlauf','⌥⌘Z'],['Bearbeiten','Kopieren','⌘C'],['Bearbeiten','Einfügen','⌘V'],['Ebenen','Neue Ebene','⇧⌘N',1],['Ebenen','Duplikat','⌘J'],['Ebenen','Gruppe','⌘G'],['Ebenen','Maske','⌥⌘G'],['Ebenen','Reduzieren','⇧⌘E'],['Auswahl','Alles','⌘A',1],['Auswahl','Aufheben','⌘D'],['Auswahl','Umkehren','⇧⌘I'],['Auswahl','Verfeinern','⌥⌘R'],['Auswahl','Transform','⌘T'],['Werkzeug','Pinsel','B',1],['Werkzeug','Radierer','E'],['Werkzeug','Bewegen','V'],['Werkzeug','Lasso','L'],['Werkzeug','Farben tauschen','X'],['Ansicht','Einpassen','⌘0',1],['Ansicht','100 %','⌘1'],['Ansicht','Lineale','⌘R'],['Ansicht','Bildgröße','⌥⌘I']];
const VARIANT='bar';
const KEYS_PX=9.5;
const PRESSED=9;
class Component extends DCLogic{
  renderVals(){
    const tiles=BTN.map((b,i)=>{
      const key=GROUPS[b[0]];
      const c=COLORS[key];
      const filled=VARIANT==='fill'||(VARIANT==='mix'&&b[3]);
      let style=filled?'background:'+c+';color:#fff':'background:#25262B;color:#F2F3F5';
      let bar=filled?'display:none':'background:'+c;
      if(i===PRESSED){
        style='background:#3A2A22;color:#fff;transform:scale(.94);box-shadow:0 0 0 2px '+c+',0 0 22px rgba(204,66,12,.55)';
        bar='background:'+c+';left:12%;right:12%;height:4px';
      }
      return {
        label:b[1],
        keys:b[2],
        style:style,
        kf:(filled?'color:rgba(255,255,255,.88)':'color:#B9BCC5')+';font-size:'+KEYS_PX+'px',
        bar:bar
      };
    });
    return {tiles:tiles};
  }
}
</script>
</body>
</html>
