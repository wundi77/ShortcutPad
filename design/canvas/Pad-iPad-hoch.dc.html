<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>iPad hoch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #5B9BFF;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.tile{position:relative;aspect-ratio:1/1;border:0;border-radius:24px;padding:8px 6px 18px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 18px rgba(0,0,0,.35)}
.tl{font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tk{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:.02em}
.tab{position:absolute;top:0;left:14%;width:34%;height:8px;border-radius:0 0 6px 6px}
.tb{position:absolute;left:20%;right:20%;bottom:11px;height:4px;border-radius:2px}
</style>
</helmet>
<div style="position:relative;width:820px;height:1180px;box-sizing:border-box;display:flex;flex-direction:column;padding:32px 28px 0;overflow:hidden;background:radial-gradient(100% 30% at 50% 0%,rgba(11,99,240,.18),rgba(11,99,240,0) 70%),#0E0F12">

  <div style="flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px">
    <a href="Zustand-Set-Waehler.dc.html" style="display:inline-flex;align-items:center;gap:12px;min-height:52px;color:#F2F3F5;text-decoration:none">
      <span style="width:14px;height:14px;border-radius:50%;background:#0B63F0"></span>
      <span style="font-size:34px;font-weight:800;letter-spacing:-.015em">Photoshop</span>
      <svg width="18" height="18" viewBox="0 0 12 12" fill="none" stroke="#9A9DA7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>
      <span class="mono" style="padding:3px 8px;border:1px solid #3B3E47;border-radius:7px;font-size:12px;letter-spacing:.08em;color:#A3A6AF">AUTO</span>
    </a>
    <button aria-label="Set fixieren" style="flex:none;width:52px;height:52px;border:0;border-radius:50%;background:#1C1D21;color:#B9BCC5;display:inline-flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 5 3 3v2H7v-2l3-3-1-5z"/><path d="M12 13v8"/></svg>
    </button>
  </div>

  <div style="flex:1;min-height:0;margin-top:26px;overflow:hidden">
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="15">
        <button class="tile" style="{{t.style}}">
          <span class="tab" style="{{t.tab}}"></span>
          <span class="tl" style="font-size:18px">{{t.label}}</span>
          <span class="tk" style="{{t.kf}}">{{t.keys}}</span>
          <span class="tb" style="{{t.bar}}"></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:9px" aria-hidden="true">
    <span style="width:24px;height:8px;border-radius:4px;background:#fff"></span>
    <span style="width:8px;height:8px;border-radius:4px;background:#4A4D57"></span>
    <span style="width:8px;height:8px;border-radius:4px;background:#4A4D57"></span>
    <span style="width:8px;height:8px;border-radius:4px;background:#4A4D57"></span>
    <span style="width:8px;height:8px;border-radius:4px;background:#4A4D57"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
const COLORS={rot:'#E11D48',orange:'#CC420C',pink:'#DB2777',blau:'#0B63F0',indigo:'#6D4DE6',gruen:'#15803D',tuerkis:'#0E7490',grau:'#64748B'};
const GROUPS={Datei:'blau',Bearbeiten:'indigo',Ebenen:'orange',Auswahl:'rot',Werkzeug:'gruen',Ansicht:'tuerkis'};
const BTN=[['blau','Speichern','⌘S',1],['indigo','Zurück','⌘Z',1],['orange','Neue Ebene','⇧⌘N',1],['gruen','Pinsel','B',1],['blau','Datei','',0,4],['indigo','Bearbeiten','',0,3],['orange','Ebenen','',0,4],['rot','Auswahl','',0,5],['gruen','Werkzeug','',0,2],['tuerkis','Ansicht','',0,3],['indigo','Vor','⇧⌘Z',0],['gruen','Radierer','E',0],['gruen','Bewegen','V',0],['tuerkis','Einpassen','⌘0',1]];
const VARIANT='bar';
const KEYS_PX=12.5;
class Component extends DCLogic{
  renderVals(){
    const tiles=BTN.map(b=>{
      const key=b[0];
      const c=COLORS[key];
      const filled=VARIANT==='fill'||(VARIANT==='mix'&&(b[3]||b.length>4));
      return {
        label:b[1],
        keys:b.length>4?b[4]+' Buttons':b[2],
        style:filled?'background:'+c+';color:#fff':'background:#25262B;color:#F2F3F5',
        kf:(filled?'color:rgba(255,255,255,.88)':'color:#A3A6AF')+';font-size:'+KEYS_PX+'px',
        bar:filled?'display:none':'background:'+c,
        tab:b.length>4?'background:'+(filled?'rgba(255,255,255,.4)':c):'display:none'
      };
    });
    return {tiles:tiles};
  }
}
</script>
</body>
</html>
