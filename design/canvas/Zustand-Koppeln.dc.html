<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Webseite koppeln</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #5B9BFF;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.digit{flex:1;min-width:0;height:64px;border-radius:14px;background:#1C1D21;box-shadow:inset 0 0 0 1px #34363D;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:30px;font-weight:500}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;padding:56px 24px 0;overflow:hidden;background:radial-gradient(120% 40% at 50% 0%,rgba(11,99,240,.18),rgba(11,99,240,0) 70%),#0E0F12">

  <div class="mono" style="padding-top:14px;font-size:12px;letter-spacing:.14em;color:#A3A6AF">SHORTCUTPAD</div>

  <div style="margin-top:96px;display:flex;flex-direction:column;gap:12px">
    <div style="font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance">Mit dem Mac koppeln</div>
    <div style="font-size:16px;line-height:1.5;color:#B9BCC5">Gib den Code ein, der im ShortcutPad-Fenster am Mac steht. Das ist pro Gerät nur einmal nötig.</div>
  </div>

  <div role="group" aria-label="Kopplungscode, sechs Ziffern" style="margin-top:32px;display:flex;gap:8px">
    <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
      <div class="digit" style="{{d.style}}">{{d.v}}</div>
    </sc-for>
  </div>

  <button style="margin-top:20px;height:54px;border:0;border-radius:14px;background:#2A2C32;color:#9A9DA7;font-size:17px;font-weight:700;cursor:default">Koppeln</button>

  <div style="margin-top:18px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.45;color:#A3A6AF">
    <div>Mac: Mac Studio · 192.168.178.24</div>
    <div>Nach fünf falschen Codes pausiert die Kopplung 30 Sekunden.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic{
  renderVals(){
    const vals=['4','8','2','','',''];
    return {
      digits:vals.map((v,i)=>({v:v,style:i===3?'box-shadow:inset 0 0 0 2px #5B9BFF;background:#1C2230':''}))
    };
  }
}
</script>
</body>
</html>
