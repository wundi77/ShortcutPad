<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mac nicht erreichbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Schibsted Grotesk',-apple-system,'SF Pro Text',system-ui,sans-serif;color:#F2F3F5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #5B9BFF;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
.tile{position:relative;aspect-ratio:1/1;border:0;border-radius:16px;padding:6px 5px 12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 14px rgba(0,0,0,.35)}
.tl{font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.tk{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;letter-spacing:.02em}
.tb{position:absolute;left:20%;right:20%;bottom:7px;height:3px;border-radius:2px}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;padding-top:56px;overflow:hidden;background:#0E0F12">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px">
    <div style="display:inline-flex;align-items:center;gap:9px;min-height:44px">
      <span style="width:11px;height:11px;border-radius:50%;background:#64748B"></span>
      <span style="font-size:24px;font-weight:800;letter-spacing:-.01em;color:#B9BCC5">Photoshop</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:0 16px;margin-top:-2px;font-size:12.5px;color:#FF9AA8">
    <span style="width:7px;height:7px;border-radius:50%;background:#FF6B7F"></span>Kein Mac verbunden
  </div>

  <div style="margin:16px 16px 0;padding:18px;border-radius:16px;background:#2B1A1D;display:flex;flex-direction:column;gap:10px">
    <div style="font-size:17px;font-weight:700;color:#FFC2CB">Mac nicht erreichbar</div>
    <div style="font-size:14px;line-height:1.5;color:#E9CDD2">Läuft ShortcutPad am Mac? Beide Geräte müssen im selben WLAN sein, oder das USB-Kabel steckt und die App ist vorne.</div>
    <button style="margin-top:4px;height:48px;border:0;border-radius:12px;background:#F2F3F5;color:#111214;font-size:15px;font-weight:700;cursor:pointer">Erneut versuchen</button>
  </div>

  <div style="flex:1;min-height:0;margin-top:16px;padding:0 14px;overflow:hidden;opacity:.35;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)" aria-hidden="true">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12">
        <div class="tile" style="{{t.style}}">
          <span class="tl" style="font-size:12.5px">{{t.label}}</span>
          <span class="tk" style="{{t.kf}}">{{t.keys}}</span>
          <span class="tb" style="{{t.bar}}"></span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const COLORS={rot:'#E11D48',orange:'#CC420C',pink:'#DB2777',blau:'#0B63F0',indigo:'#6D4DE6',gruen:'#15803D',tuerkis:'#0E7490',grau:'#64748B'};
const GROUPS={Datei:'blau',Bearbeiten:'indigo',Ebenen:'orange',Auswahl:'rot',Werkzeug:'gruen',Ansicht:'tuerkis'};
const BTN=[['Datei','Neu','⌘N'],['Datei','Speichern','⌘S',1],['Datei','Speichern als','⇧⌘S'],['Datei','Für Web','⌥⇧⌘S'],['Bearbeiten','Zurück','⌘Z',1],['Bearbeiten','Vor','⇧⌘Z'],['Bearbeiten','Verlauf','⌥⌘Z'],['Bearbeiten','Kopieren','⌘C'],['Bearbeiten','Einfügen','⌘V'],['Ebenen','Neue Ebene','⇧⌘N',1],['Ebenen','Duplikat','⌘J'],['Ebenen','Gruppe','⌘G'],['Ebenen','Maske','⌥⌘G'],['Ebenen','Reduzieren','⇧⌘E'],['Auswahl','Alles','⌘A',1],['Auswahl','Aufheben','⌘D'],['Auswahl','Umkehren','⇧⌘I'],['Auswahl','Verfeinern','⌥⌘R'],['Auswahl','Transform','⌘T'],['Werkzeug','Pinsel','B',1],['Werkzeug','Radierer','E'],['Werkzeug','Bewegen','V'],['Werkzeug','Lasso','L'],['Werkzeug','Farben tauschen','X'],['Ansicht','Einpassen','⌘0',1],['Ansicht','100 %','⌘1'],['Ansicht','Lineale','⌘R'],['Ansicht','Bildgröße','⌥⌘I']];
const VARIANT='bar';
const KEYS_PX=9.5;
class Component extends DCLogic{
  renderVals(){
    const tiles=BTN.map(b=>{
      const key=GROUPS[b[0]];
      const c=COLORS[key];
      const filled=VARIANT==='fill'||(VARIANT==='mix'&&b[3]);
      return {
        label:b[1],
        keys:b[2],
        style:filled?'background:'+c+';color:#fff':'background:#25262B;color:#F2F3F5',
        kf:(filled?'color:rgba(255,255,255,.88)':'color:#A3A6AF')+';font-size:'+KEYS_PX+'px',
        bar:filled?'display:none':'background:'+c
      };
    });
    return {tiles:tiles};
  }
}
</script>
</body>
</html>
