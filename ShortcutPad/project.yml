name: ShortcutPad

options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: de

# Team-ID und Bundle-Präfix stehen in Config/Signing.xcconfig
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ShortcutPadHelper:
    type: application
    platform: macOS
    sources:
      - MacHelper
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PAD_BUNDLE_PREFIX).helper"
        PRODUCT_NAME: ShortcutPadHelper
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ShortcutPad Helper"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Menüleisten-App: kein Dock-Symbol, läuft im Hintergrund bis „Beenden“
        INFOPLIST_KEY_LSUIElement: YES
        COMBINE_HIDPI_IMAGES: YES
        # Ohne Sandbox: nötig für das Senden von Tastendrücken an andere Programme
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
